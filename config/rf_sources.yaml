# Caminho do extrato local da Receita Federal (ver src/prospector/rf_source.py)
# por segmento, e o CNAE usado para gerar esse extrato via BigQuery
# (basedosdados.br_me_cnpj.estabelecimentos), para referência ao atualizar.
#
# Colunas do CSV: só "cnpj" é obrigatória (nome do estabelecimento vem do
# próprio Portal SEUMA na hora da checagem — ver get_result_name em
# etapa3_seuma.py). "socio_nome" é opcional (nome do dono/sócio, vindo do
# JOIN com basedosdados.br_me_cnpj.socios) e "bairro" também é opcional
# (só segmentos que precisam de filtro por bairro têm essa coluna).
#
# Como gerar/atualizar um extrato: ver README.md, seção "Atualizando a base
# da Receita Federal local".

Restaurantes:
  csv: data/rf_fortaleza_restaurantes.csv
  cnae_fiscal_principal: "5611201"

