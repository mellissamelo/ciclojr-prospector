# Tabela de segmentos e licenças exigidas (fonte: prompt-construcao-sistema-leads-licencas.md)
#
# forte_demanda: siglas com ✅ no documento original — pelo menos uma dessas,
#   vencida ou ausente, é exigida para o lead ser qualificado (regra da Etapa 3, item 6).
# condicional: siglas com ⚠️ — dependem da atividade/estrutura específica do
#   estabelecimento. São checadas e reportadas se vencidas/ausentes, mas
#   sozinhas NÃO qualificam um lead.
#
# Siglas: AF, AS, CCB, LAR, LPP, LS, MBP, POP, PGRS_PGRSS, Outorga

